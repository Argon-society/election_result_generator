<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18212b">
  <title>Election Map Studio — Professional</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
<header class="app-header">
  <div class="header-left">
    <div class="app-symbol">EM</div>
    <div>
      <div class="app-name">Election Map Studio</div>
      <div class="app-sub">選挙結果地図作成・集計ツール</div>
    </div>
  </div>
  <div class="header-actions">
    <button id="newProjectBtn">新規</button>
    <button id="loadProjectBtn">プロジェクト読込</button>
    <button id="saveProjectBtn">保存</button>
    <button id="exportSvgBtn" class="primary">SVG</button>
    <button id="exportPngBtn">PNG</button>
  </div>
</header>

<div class="app-layout">
  <aside class="control-panel">
    <div class="panel-scroll">

      <section class="control-section">
        <div class="section-heading">
          <span class="section-index">01</span>
          <div><strong>地図</strong><small>GeoJSON / 選挙区識別</small></div>
        </div>

        <div id="dropzone" class="file-box">
          <input id="geojsonInput" type="file" accept=".geojson,.json,application/geo+json">
          <strong>GeoJSONを開く</strong>
          <span>クリックまたはドラッグ＆ドロップ</span>
        </div>

        <div class="field-row">
          <label class="field">
            <span>選挙区ID</span>
            <select id="idField">
              <option value="auto">自動</option>
              <option value="id">Feature.id</option>
              <option value="name">properties.name</option>
              <option value="code">properties.code</option>
            </select>
          </label>
        </div>

        <div class="status-line" id="dataStatus">サンプル地図を読込済み</div>
      </section>

      <section class="control-section">
        <div class="section-heading">
          <span class="section-index">02</span>
          <div><strong>選挙制度</strong><small>日本の制度プリセット / 集計方法</small></div>
        </div>

        <label class="field">
          <span>制度プリセット</span>
          <select id="preset">
            <option value="shugiin-smd">衆議院・小選挙区</option>
            <option value="shugiin-pr">衆議院・比例代表（ブロック）</option>
            <option value="sangiin-district">参議院・選挙区</option>
            <option value="sangiin-pr">参議院・比例代表（全国）</option>
            <option value="mmd-sntv">大選挙区・単記非移譲式</option>
            <option value="mmd-party">複数人区・党派順位方式</option>
            <option value="custom">カスタム</option>
          </select>
        </label>

        <label class="field">
          <span>集計モード</span>
          <select id="system">
            <option value="smd">小選挙区・最多得票</option>
            <option value="mmd">複数人区・得票順位</option>
            <option value="pr">比例代表・政党得票</option>
          </select>
        </label>

        <div class="field-grid-2">
          <label class="field">
            <span>議席数</span>
            <input id="seatCount" type="number" min="1" max="1000" value="1">
          </label>
          <label class="field">
            <span>比例配分</span>
            <select id="allocationMethod">
              <option value="dhondt">ドント式</option>
              <option value="sainte-lague">サン＝ラグ式</option>
            </select>
          </label>
        </div>

        <div id="systemOptions"></div>
        <div class="info-box" id="systemHint"></div>
      </section>

      <section class="control-section results-section">
        <div class="section-heading">
          <span class="section-index">03</span>
          <div><strong>結果入力</strong><small>得票数 / 順位を明示的に設定</small></div>
        </div>

        <div class="mode-tabs">
          <button class="active" data-mode="votes">得票数</button>
          <button data-mode="ranking">設定順位</button>
        </div>

        <div class="result-tools">
          <button id="fillDemoBtn">サンプル結果</button>
          <button id="clearResultsBtn">結果を消去</button>
        </div>

        <div id="resultEditor"></div>
      </section>

      <section class="control-section">
        <div class="section-heading">
          <span class="section-index">04</span>
          <div><strong>表示</strong><small>凡例・ラベル・当選ボール</small></div>
        </div>

        <label class="check-row"><input id="showLabels" type="checkbox" checked> <span>選挙区名</span></label>
        <label class="check-row"><input id="showBalls" type="checkbox" checked> <span>当選議席ボール</span></label>
        <label class="check-row"><input id="showVoteShare" type="checkbox" checked> <span>得票率</span></label>
        <label class="check-row"><input id="showNames" type="checkbox" checked> <span>候補者・党派名</span></label>

        <label class="field">
          <span>地図タイトル</span>
          <input id="electionTitle" value="選挙結果地図">
        </label>
        <label class="field">
          <span>副題</span>
          <input id="electionSubtitle" value="Election Map Studio">
        </label>
      </section>

      <section class="control-section">
        <div class="section-heading">
          <span class="section-index">05</span>
          <div><strong>政党</strong><small>色・正式名称</small></div>
        </div>
        <div id="partyLegend"></div>
      </section>

      <section class="control-section">
        <div class="section-heading">
          <span class="section-index">06</span>
          <div><strong>検証</strong><small>データ不備を表示</small></div>
        </div>
        <div id="validation"></div>
      </section>
    </div>

    <div class="panel-footer">
      <span id="saveState">未保存の変更あり</span>
      <span>v4 Professional</span>
    </div>
  </aside>

  <main class="workspace">
    <div class="workspace-toolbar">
      <div class="toolbar-left">
        <span class="document-title" id="documentTitle">選挙結果地図</span>
        <span class="separator">|</span>
        <span id="statusText">準備完了</span>
      </div>
      <div class="toolbar-right">
        <button id="zoomOut">−</button>
        <button id="zoomReset">100%</button>
        <button id="zoomIn">＋</button>
        <button id="fitMap">全体表示</button>
      </div>
    </div>

    <section class="map-frame">
      <svg id="map" viewBox="0 0 1280 860" role="img" aria-label="選挙結果地図">
        <defs>
          <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e9edf1" stroke-width="1"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="1280" height="860" fill="url(#gridPattern)"></rect>
      </svg>
    </section>

    <div class="statusbar">
      <div><strong id="mapTitle"></strong><span id="mapSubtitle"></span></div>
      <div id="seatSummary"></div>
    </div>
  </main>
</div>

<input type="file" id="projectInput" accept=".json,application/json" hidden>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
